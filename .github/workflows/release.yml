name: Release

# Builds the portable package from a version tag, optionally has it code-signed through SignPath, and attaches the result to a
# DRAFT pre-release that the owner reads and publishes by hand. Nothing in this file publishes a release by itself.
#
#   push of a tag v*   full run: build, check, sign (only if enabled), create the draft release
#   pull request       only when this file, the build scripts or the signing setup change: build and check, nothing else
#   manual run         build and check, nothing else
#
# Signing stays off until the repository variable SIGNPATH_ENABLED is set to "true". See docs/SIGNPATH_SETUP.md.
# Releases are still made on a branch and merged by pull request first; the tag goes on the merged commit.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-release.ps1'
      - 'scripts/check-package.ps1'
      - 'scripts/verify-signed-package.ps1'
      - 'scripts/write-release-body.ps1'
      - '.signpath/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the package
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      unsigned-files-id: ${{ steps.upload-files.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Read the version and check the release is ready
        id: version
        shell: pwsh
        run: |
          $projectFile = 'src/VRChatTranslator.App/VRChatTranslator.App.csproj'
          $version = ([xml](Get-Content -LiteralPath $projectFile -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Could not read an x.y.z <Version> from $projectFile (got '$version')." }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag $env:GITHUB_REF_NAME does not match the app version $version in $projectFile."
          }
          $firstHeading = Get-Content -LiteralPath RELEASE_NOTES.md | Where-Object { $_ -like '# *' } | Select-Object -First 1
          if ($firstHeading -notlike "# $version *") {
            throw "The first heading in RELEASE_NOTES.md is '$firstHeading'; it must start with '# $version '."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Restore
        run: dotnet restore VRChatUniversalTranslator.slnx --configfile NuGet.Config

      - name: Build (warnings are errors)
        run: dotnet build VRChatUniversalTranslator.slnx --configuration Release --no-restore

      - name: Deterministic tests
        run: dotnet run --no-build --configuration Release --project tests/VRChatTranslator.Core.Tests/VRChatTranslator.Core.Tests.csproj

      - name: Known-vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list VRChatUniversalTranslator.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { throw 'A vulnerable package was found.' }

      - name: Build the portable package
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Check the package and write its checksum
        shell: pwsh
        run: ./scripts/check-package.ps1 -Version '${{ steps.version.outputs.version }}' -WorkspacePath $env:GITHUB_WORKSPACE

      # The loose files go up on their own so SignPath can sign them. Only needed for a tag, and only when signing is on.
      - name: Upload the files to be signed
        id: upload-files
        if: github.ref_type == 'tag' && vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-files
          path: artifacts/VRChatUniversalTranslator-${{ steps.version.outputs.version }}-win-x64
          retention-days: 7
          if-no-files-found: error

      - name: Upload the unsigned package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-unsigned
          path: |
            artifacts/VRChatUniversalTranslator-${{ steps.version.outputs.version }}-win-x64-portable.zip
            artifacts/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  sign:
    name: Sign with SignPath
    needs: build
    # Off until SIGNPATH_ENABLED is "true". Never runs for pull requests or manual runs.
    if: github.ref_type == 'tag' && vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Submit the signing request and wait for the approval
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.unsigned-files-id }}
          wait-for-completion: true
          output-artifact-directory: signed-download
          parameters: |
            version: "${{ needs.build.outputs.version }}"

      - name: Fetch the unsigned package to compare against
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-unsigned
          path: unsigned-download

      - name: Check the signatures and assemble the signed package
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $zipName = "VRChatUniversalTranslator-$version-win-x64-portable.zip"

          Expand-Archive -LiteralPath "unsigned-download/$zipName" -DestinationPath unsigned-files -Force

          # SignPath returns either the signed archive or its content; handle both.
          $archives = @(Get-ChildItem -LiteralPath signed-download -Filter *.zip -File -Recurse)
          if ($archives.Count -eq 1) { Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath signed-files -Force }
          elseif ($archives.Count -eq 0) { Copy-Item -Path signed-download -Destination signed-files -Recurse -Force }
          else { throw "Expected one signed archive from SignPath, found $($archives.Count)." }

          ./scripts/verify-signed-package.ps1 -UnsignedFolder unsigned-files -SignedFolder signed-files

          New-Item -ItemType Directory -Force -Path release-signed | Out-Null
          Compress-Archive -Path 'signed-files/*' -DestinationPath "release-signed/$zipName" -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath "release-signed/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText('release-signed/SHA256SUMS.txt', "$hash  $zipName`n")
          Write-Host "Signed package SHA-256 $hash"

      - name: Upload the signed package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-signed
          path: release-signed/*
          retention-days: 14
          if-no-files-found: error

  draft-release:
    name: Create the draft pre-release
    needs: [build, sign]
    if: ${{ always() && github.ref_type == 'tag' && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.sign.result == 'success' && 'release-signed' || 'release-unsigned' }}
          path: release

      - name: Write the release text
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $zipName = "VRChatUniversalTranslator-$version-win-x64-portable.zip"
          $sums = (Get-Content -LiteralPath release/SHA256SUMS.txt -Raw).Trim()
          $hash = ($sums -split '\s+')[0]
          if ($hash -ne (Get-FileHash -LiteralPath "release/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'SHA256SUMS.txt does not match the ZIP.' }
          $signed = '${{ needs.sign.result }}' -eq 'success'
          ./scripts/write-release-body.ps1 -Version $version -ZipName $zipName -Sha256 $hash -OutputPath release-body.md -Signed:$signed

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/VRChatUniversalTranslator-$VERSION-win-x64-portable.zip" release/SHA256SUMS.txt \
            --draft --prerelease --verify-tag \
            --title "VRChat Universal Translator $VERSION" \
            --notes-file release-body.md
          echo "Draft pre-release created for $GITHUB_REF_NAME. Read it, then publish it from the Releases page." >> "$GITHUB_STEP_SUMMARY"
