name: Feature request
description: Suggest something the app could do
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The app is local-first: captions and translation stay on your PC, with no accounts, telemetry or paid services.
        Ideas that need any of those are unlikely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
